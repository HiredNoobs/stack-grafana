# Grafana on a node labelled ${STACK}_grafana. SQLite, so a single instance, with its data
# (users, preferences, anything made in the UI) on a ${MONITORING_STORAGE_CLASS} volume. The
# data sources and dashboards are provisioned from configs/grafana.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  serviceName: grafana
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
      annotations:
        checksum/config: "${MONITORING_CONFIG_CHECKSUM}"
    spec:
      nodeSelector:
        ${STACK}_grafana: ""
      # The grafana user from the image, fsGroup lets it write its data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: grafana
          image: ${GRAFANA_IMAGE}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_SERVER_PROTOCOL
              value: https
            - name: GF_SERVER_HTTP_PORT
              value: "${GRAFANA_PORT}"
            - name: GF_SERVER_CERT_FILE
              value: /etc/grafana/tls/grafana.crt
            - name: GF_SERVER_CERT_KEY
              value: /etc/grafana/tls/grafana.key
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.${DOMAIN}"
            # Installed on start, replaces the swarm stack's grafana_install_plugins command.
            - name: GF_PLUGINS_PREINSTALL
              value: victoriametrics-logs-datasource,victoriametrics-metrics-datasource
          ports:
            - name: https
              containerPort: ${GRAFANA_PORT}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            # Plugins are installed before it starts listening.
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: tls
              mountPath: /etc/grafana/tls
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: tls
          secret:
            secretName: monitoring-tls
            defaultMode: 0440
            items:
              - { key: ca.crt, path: ca.crt }
              - { key: grafana.crt, path: grafana.crt }
              - { key: grafana.key, path: grafana.key }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: grafana
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${MONITORING_STORAGE_CLASS}
        resources:
          requests:
            storage: ${GRAFANA_VOLUME_SIZE}
---
# nginx proxies grafana.$DOMAIN here.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: https
      port: ${GRAFANA_PORT}
      targetPort: https
      protocol: TCP
