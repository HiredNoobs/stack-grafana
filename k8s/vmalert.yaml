# vmalert on a node labelled ${STACK}_vmalert, a single replica so alerts aren't sent twice.
# Evaluates configs/vmalert against VictoriaMetrics and notifies Alertmanager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  labels:
    app.kubernetes.io/name: vmalert
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
      annotations:
        checksum/config: "${MONITORING_CONFIG_CHECKSUM}"
    spec:
      nodeSelector:
        ${STACK}_vmalert: ""
      containers:
        - name: vmalert
          image: ${VMALERT_IMAGE}
          args:
            - "--httpListenAddr=:${VMALERT_HTTP_PORT}"
            - "--tls"
            - "--tlsCertFile=/etc/vmalert/tls/vmalert.crt"
            - "--tlsKeyFile=/etc/vmalert/tls/vmalert.key"
            - "--datasource.url=https://victoriametrics.${K8S_NAMESPACE}.svc:${VICTORIAMETRICS_HTTP_PORT}"
            - "--datasource.tlsCAFile=/etc/vmalert/tls/ca.crt"
            - "--remoteRead.url=https://victoriametrics.${K8S_NAMESPACE}.svc:${VICTORIAMETRICS_HTTP_PORT}"
            - "--remoteRead.tlsCAFile=/etc/vmalert/tls/ca.crt"
            - "--remoteWrite.url=https://vmagent.${K8S_NAMESPACE}.svc:${VMAGENT_HTTP_PORT}"
            - "--remoteWrite.tlsCAFile=/etc/vmalert/tls/ca.crt"
            - "--notifier.url=https://alertmanager.${K8S_NAMESPACE}.svc:${ALERTMANAGER_HTTP_PORT}"
            - "--notifier.tlsCAFile=/etc/vmalert/tls/ca.crt"
            - "--rule=/etc/alerts/*.yml"
            - "--external.url=https://grafana.${DOMAIN}"
            - '--external.alert.source=explore?orgId=1&left={"datasource":"VictoriaMetrics","queries":[{"expr":{{.Expr|jsonEscape|queryEscape}},"refId":"A"}],"range":{"from":"{{ .ActiveAt.UnixMilli }}","to":"now"}}'
          ports:
            - name: https
              containerPort: ${VMALERT_HTTP_PORT}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: rules
              mountPath: /etc/alerts
              readOnly: true
            - name: tls
              mountPath: /etc/vmalert/tls
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
        - name: tls
          secret:
            secretName: monitoring-tls
            items:
              - { key: ca.crt, path: ca.crt }
              - { key: vmalert.crt, path: vmalert.crt }
              - { key: vmalert.key, path: vmalert.key }
---
# vmalert.$DOMAIN through nginx.
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  labels:
    app.kubernetes.io/name: vmalert
spec:
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: https
      port: ${VMALERT_HTTP_PORT}
      targetPort: https
      protocol: TCP
