# vmagent on a node labelled ${STACK}_vmagent, a single replica so nothing is scraped twice.
# Scrapes the targets in configs/vmagent (found through the Kubernetes API, see rbac.yaml) and
# writes to VictoriaMetrics. Its buffer, for while VictoriaMetrics is down, is in an emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  labels:
    app.kubernetes.io/name: vmagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmagent
      annotations:
        checksum/config: "${MONITORING_CONFIG_CHECKSUM}"
    spec:
      serviceAccountName: vmagent
      nodeSelector:
        ${STACK}_vmagent: ""
      containers:
        - name: vmagent
          image: ${VMAGENT_IMAGE}
          args:
            - "--httpListenAddr=:${VMAGENT_HTTP_PORT}"
            - "--tls"
            - "--tlsCertFile=/etc/vmagent/tls/vmagent.crt"
            - "--tlsKeyFile=/etc/vmagent/tls/vmagent.key"
            - "--remoteWrite.url=https://victoriametrics.${K8S_NAMESPACE}.svc:${VICTORIAMETRICS_HTTP_PORT}/api/v1/write"
            - "--remoteWrite.tmpDataPath=/vmagentdata"
            - "--remoteWrite.tlsCAFile=/etc/vmagent/tls/ca.crt"
            - "--promscrape.config=/etc/vmagent/config.yml"
          ports:
            - name: https
              containerPort: ${VMAGENT_HTTP_PORT}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vmagent/config.yml
              subPath: vmagent.yml
              readOnly: true
            - name: tls
              mountPath: /etc/vmagent/tls
              readOnly: true
            - name: buffer
              mountPath: /vmagentdata
      volumes:
        - name: config
          configMap:
            name: vmagent-config
        - name: tls
          secret:
            secretName: monitoring-tls
            items:
              - { key: ca.crt, path: ca.crt }
              - { key: vmagent.crt, path: vmagent.crt }
              - { key: vmagent.key, path: vmagent.key }
        - name: buffer
          emptyDir:
            sizeLimit: 1Gi
---
# vmagent.$DOMAIN through nginx, in the cluster for vmalert's remote write.
apiVersion: v1
kind: Service
metadata:
  name: vmagent
  labels:
    app.kubernetes.io/name: vmagent
spec:
  selector:
    app.kubernetes.io/name: vmagent
  ports:
    - name: https
      port: ${VMAGENT_HTTP_PORT}
      targetPort: https
      protocol: TCP
