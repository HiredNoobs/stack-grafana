# VictoriaMetrics (single node) on a node labelled ${STACK}_victoriametrics, with its data on a
# ${MONITORING_STORAGE_CLASS} volume. vmagent writes to it, Grafana and vmalert read from it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  serviceName: victoriametrics
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
      annotations:
        checksum/config: "${MONITORING_CONFIG_CHECKSUM}"
    spec:
      nodeSelector:
        ${STACK}_victoriametrics: ""
      containers:
        - name: victoriametrics
          image: ${VICTORIAMETRICS_IMAGE}
          args:
            - "--storageDataPath=/victoria-metrics-data"
            - "--httpListenAddr=:${VICTORIAMETRICS_HTTP_PORT}"
            - "--tls"
            - "--tlsCertFile=/etc/victoriametrics/tls/victoriametrics.crt"
            - "--tlsKeyFile=/etc/victoriametrics/tls/victoriametrics.key"
            - "--retentionPeriod=${MONITORING_RETENTION}"
          ports:
            - name: https
              containerPort: ${VICTORIAMETRICS_HTTP_PORT}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tls
              mountPath: /etc/victoriametrics/tls
              readOnly: true
            - name: data
              mountPath: /victoria-metrics-data
      volumes:
        - name: tls
          secret:
            secretName: monitoring-tls
            items:
              - { key: victoriametrics.crt, path: victoriametrics.crt }
              - { key: victoriametrics.key, path: victoriametrics.key }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: victoriametrics
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ${MONITORING_STORAGE_CLASS}
        resources:
          requests:
            storage: ${VICTORIAMETRICS_VOLUME_SIZE}
---
# victoriametrics.$DOMAIN through nginx, in the cluster for vmagent, vmalert and Grafana.
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  labels:
    app.kubernetes.io/name: victoriametrics
spec:
  selector:
    app.kubernetes.io/name: victoriametrics
  ports:
    - name: https
      port: ${VICTORIAMETRICS_HTTP_PORT}
      targetPort: https
      protocol: TCP
